project_id = "wisdom-source-school-portal"

[api]
enabled = true
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.login-by-id]
verify_jwt = false

[functions.provision-account]
verify_jwt = true

[functions.change-password]
verify_jwt = true

[functions.reset-account-password]
verify_jwt = true

[analytics]
enabled = false
